name: Install mcp-publisher
description: Download the pinned mcp-publisher release, check its sha256 and put it on PATH.

runs:
  using: composite
  steps:
    - name: Install mcp-publisher
      shell: bash
      env:
        MCP_PUBLISHER_VERSION: v1.8.1
        # sha256 of mcp-publisher_linux_amd64.tar.gz, from registry_1.8.1_checksums.txt in the release
        MCP_PUBLISHER_SHA256: a06c9096dcb9727c13555b6be26c7effa707b01f06a4c561ba7a3635443cf2cc
      run: |
        dir="$RUNNER_TEMP/mcp-publisher"
        mkdir -p "$dir"
        curl -fsSLo "$dir/mcp-publisher.tar.gz" "https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}/mcp-publisher_linux_amd64.tar.gz"
        echo "${MCP_PUBLISHER_SHA256}  $dir/mcp-publisher.tar.gz" | sha256sum -c -
        tar xzf "$dir/mcp-publisher.tar.gz" -C "$dir" mcp-publisher
        echo "$dir" >> "$GITHUB_PATH"
