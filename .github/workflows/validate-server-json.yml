name: Validate server.json

on:
  pull_request:
    paths: ["server.json", ".github/workflows/validate-server-json.yml", ".github/actions/install-mcp-publisher/**"]
  push:
    branches: [main]
    paths: ["server.json", ".github/workflows/validate-server-json.yml", ".github/actions/install-mcp-publisher/**"]
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The bluebox.ai key file grants only ai.bluebox/* and the registry compares
      # case-sensitively, so a wrong name would only fail at publish time with a 403.
      - name: Check server.json name is in the ai.bluebox namespace
        run: |
          expected="ai.bluebox/"
          actual=$(jq -r .name server.json)
          case "$actual" in
            "$expected"*) echo "OK   server.json (name): \"$actual\"" ;;
            *) echo "FAIL server.json (name): \"$actual\" must start with \"$expected\""; exit 1 ;;
          esac
      - uses: ./.github/actions/install-mcp-publisher
      - name: Validate server.json for the MCP registry
        run: mcp-publisher validate
