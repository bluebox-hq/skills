name: Validate server.json

on:
  pull_request:
    paths: ["server.json", ".github/workflows/validate-server-json.yml"]
  push:
    branches: [main]
    paths: ["server.json", ".github/workflows/validate-server-json.yml"]
  workflow_dispatch:

permissions:
  contents: read

env:
  MCP_PUBLISHER_VERSION: v1.8.1
  # sha256 of mcp-publisher_linux_amd64.tar.gz, from registry_1.8.1_checksums.txt in the release
  MCP_PUBLISHER_SHA256: a06c9096dcb9727c13555b6be26c7effa707b01f06a4c561ba7a3635443cf2cc

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The registry grants only io.github.<owner>/* and compares case-sensitively,
      # so a wrong-case name would only fail at publish time with a 403.
      - name: Check server.json name matches the GitHub namespace
        run: |
          expected="io.github.${GITHUB_REPOSITORY_OWNER}/"
          actual=$(jq -r .name server.json)
          case "$actual" in
            "$expected"*) echo "OK   server.json (name): \"$actual\"" ;;
            *) echo "FAIL server.json (name): \"$actual\" must start with \"$expected\""; exit 1 ;;
          esac
      - name: Validate server.json for the MCP registry
        run: |
          curl -fsSLo mcp-publisher.tar.gz "https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}/mcp-publisher_linux_amd64.tar.gz"
          echo "${MCP_PUBLISHER_SHA256}  mcp-publisher.tar.gz" | sha256sum -c -
          tar xzf mcp-publisher.tar.gz mcp-publisher
          ./mcp-publisher validate
